<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desahucio</title>
<style>
:root{--bg:#1d1b24;--fg:#e8e2d4;--panel:#2e2b38;--line:#7a7488;--ac:#b5543f;--ac2:#5b7f8f}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:"Courier New",Courier,monospace;font-weight:700;-webkit-tap-highlight-color:transparent}
canvas,.pix{image-rendering:pixelated;image-rendering:crisp-edges}
.px{background:var(--panel);border:3px solid var(--line);box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--line);padding:10px;margin:8px 6px}
.btn{font:inherit;background:var(--ac);color:var(--onac,#fff);border:3px solid #000;padding:8px 12px;cursor:pointer;box-shadow:3px 3px 0 #000;text-transform:uppercase;letter-spacing:.5px;margin:3px}
.btn:active{transform:translate(3px,3px);box-shadow:none}
.btn.alt{background:var(--ac2)}.btn.dim{background:#555;color:#ddd}.btn.sel{outline:3px solid #fff;outline-offset:1px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
h1,h2,h3{margin:.3em 0;text-transform:uppercase;letter-spacing:1px}
h1{font-size:clamp(22px,5vw,34px)}h2{font-size:clamp(16px,3.5vw,22px)}
p{margin:.5em 0;line-height:1.35}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.bar{height:12px;background:#0007;border:2px solid #000;position:relative}.bar>i{display:block;height:100%;background:var(--ac);transition:width .3s}
.hide{display:none!important}
.tag{display:inline-block;border:2px solid #000;padding:0 5px;font-size:12px;background:var(--ac2);color:#fff;margin:1px}
.wrap{max-width:920px;margin:0 auto;padding:10px}
.small{font-size:12px;opacity:.85}
.center{text-align:center}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
.ov>.px{max-width:560px;width:100%;max-height:92vh;overflow:auto}
canvas.fit{width:100%;height:auto;display:block}
.good{color:#6fe08a}.bad{color:#ff7a7a}.warn{color:#ffd86b}
a{color:var(--ac2)}
@media(max-width:600px){.btn{padding:10px 9px;font-size:13px}.px{padding:8px}}

.stat{display:grid;grid-template-columns:78px 1fr 34px;gap:6px;align-items:center;font-size:12px;margin:3px 0}
.stat .bar>i{background:var(--c)}
#log{max-height:150px;overflow:auto;font-size:13px}
#log p{margin:3px 0;border-left:3px solid var(--line);padding-left:6px}
.opt{display:block;width:100%;text-align:left;text-transform:none;margin:5px 0}
.opt small{display:block;opacity:.8;font-weight:400;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <canvas id="sc" class="fit" width="320" height="120" style="border:3px solid var(--line)"></canvas>
  <div class="px" id="stats"></div>
  <div class="px" id="main"></div>
  <div class="px"><div class="small">DIARIO</div><div id="log"></div></div>
  <div class="small center">Juego de ficción. Si te enfrentas a un desahucio real, busca ayuda legal y asociaciones de vivienda de tu zona.</div>
</div>
<script>
const S = {
  day: 1,
  moral: 50,
  neighbors: 0,
  legal: 0,
  press: 0,
  cash: 30,
  end: null
};

const FIXED = [
  {day:3, text:"Notificación oficial. Tienes 30 días.", roll:()=>({legal:5})},
  {day:7, text:"Un abogado se ofrece a ayudar. ¿Aceptar?"},
  {day:10, text:"Periodista contacta. Podría hacer reportaje."},
  {day:15, text:"Junta de vecinos. ¿Convocar?"},
  {day:20, text:"Presión de desalojo se intensifica.", roll:()=>({moral:-10, cash:-10})},
  {day:25, text:"Último aviso. Última semana."},
  {day:30, text:"Día del desahucio."}
];

const RAND = [
  {text:"Vecino ofrece dinero. +15€.", roll:()=>({cash:15})},
  {text:"Voluntarios ayudan con organización.", roll:()=>({neighbors:5, moral:10})},
  {text:"Policía avanza con desalojo.", roll:()=>({moral:-15})},
  {text:"Prensa cubre tu historia.", roll:()=>({press:10, moral:15})},
  {text:"Presión legal crece.", roll:()=>({legal:-5, moral:-10})},
  {text:"Comunidad se une. Resistencia crece.", roll:()=>({neighbors:10, moral:20})},
  {text:"Falta dinero para gastos.", roll:()=>({cash:-20})},
  {text:"Apoyo inesperado llega.", roll:()=>({legal:8, press:5})}
];

const ACT = [
  {text:"Contactar abogado", cost:{cash:20}, effect:{legal:15, cash:-20}},
  {text:"Llamar a prensa", cost:{cash:0}, effect:{press:10}},
  {text:"Organizar marcha", cost:{cash:5}, effect:{moral:15, neighbors:10, cash:-5}},
  {text:"Negociar con propietario", cost:{cash:0}, effect:{legal:8, moral:5}},
  {text:"Buscar dinero (préstamos)", cost:{cash:0}, effect:{cash:50, moral:-5}},
  {text:"Mediación social", cost:{cash:10}, effect:{neighbors:15, moral:10, cash:-10}},
  {text:"Contactar ONG", cost:{cash:0}, effect:{legal:10, moral:10}},
  {text:"Documentar todo (vídeos/fotos)", cost:{cash:5}, effect:{press:12, cash:-5}}
];

function log(msg) {
  const el = document.getElementById('log');
  const p = document.createElement('p');
  p.innerHTML = msg;
  el.appendChild(p);
  el.scrollTop = el.scrollHeight;
}

function applyEffect(eff) {
  Object.keys(eff).forEach(k => {
    S[k] = Math.max(0, Math.min(100, S[k] + eff[k]));
  });
}

function checkEnd() {
  if (S.day > 30) {
    if (S.legal >= 40 || S.neighbors >= 50) {
      S.end = 'win';
      log('<span class="good">GANASTE: Se paró el desahucio. La resistencia colectiva funcionó.</span>');
    } else if (S.moral < 10 || S.cash < 5) {
      S.end = 'lose_despair';
      log('<span class="bad">PERDISTE: Se desmoralizó la resistencia.</span>');
    } else {
      S.end = 'lose_force';
      log('<span class="bad">PERDISTE: El desahucio se ejecutó a la fuerza.</span>');
    }
  }
}

function renderStats() {
  const el = document.getElementById('stats');
  el.innerHTML = `
    <h2>DÍA ${S.day} DE 30</h2>
    <div class="stat" style="--c:#6fe08a"><span>Moral</span><div class="bar"><i style="width:${S.moral}%"></i></div><span>${S.moral}</span></div>
    <div class="stat" style="--c:#5b7f8f"><span>Abogacía</span><div class="bar"><i style="width:${S.legal}%"></i></div><span>${S.legal}</span></div>
    <div class="stat" style="--c:#ffd86b"><span>Prensa</span><div class="bar"><i style="width:${S.press}%"></i></div><span>${S.press}</span></div>
    <div class="stat" style="--c:#b5543f"><span>Vecinos</span><div class="bar"><i style="width:${S.neighbors}%"></i></div><span>${S.neighbors}</span></div>
    <div class="stat" style="--c:#ddd"><span>Dinero</span><div class="bar"><i style="width:${Math.min(100,S.cash*2)}%"></i></div><span>${S.cash}€</span></div>
  `;
}

function renderMain() {
  const el = document.getElementById('main');
  if (S.end) {
    el.innerHTML = `<button class="btn" onclick="location.reload()">Reintentar</button>`;
    return;
  }
  
  let html = '<h2>Acciones disponibles</h2>';
  ACT.forEach((act, i) => {
    const canAfford = S.cash >= (act.cost.cash || 0);
    html += `<button class="btn ${!canAfford?'dim':''} opt" ${!canAfford?'disabled':''}` +
            `onclick="doAction(${i})">${act.text}${act.cost.cash?' (-'+act.cost.cash+'€)':''}</button>`;
  });
  html += `<button class="btn alt" onclick="nextDay()">Siguiente día</button>`;
  el.innerHTML = html;
}

function doAction(i) {
  const act = ACT[i];
  if (S.cash < (act.cost.cash || 0)) return;
  
  applyEffect(act.effect);
  log(`<strong>Acción:</strong> ${act.text}`);
  nextDay();
}

function nextDay() {
  S.day++;
  
  // Evento fijo
  const fixed = FIXED.find(f => f.day === S.day);
  if (fixed) {
    log(`<strong>Día ${S.day}:</strong> ${fixed.text}`);
    if (fixed.roll) applyEffect(fixed.roll());
  }
  
  // Evento aleatorio
  if (Math.random() < 0.6) {
    const evt = RAND[Math.floor(Math.random()*RAND.length)];
    log(`<strong>Evento:</strong> ${evt.text}`);
    applyEffect(evt.roll());
  }
  
  // Erosión natural
  S.moral -= 3; // Estrés diario
  if (S.neighbors > 0) S.moral += 2; // Apoyo vecinal
  S.moral = Math.max(0, Math.min(100, S.moral));
  
  checkEnd();
  renderStats();
  renderMain();
}

renderStats();
renderMain();
log('Oficina de asuntos legales. Has recibido un aviso de desahucio. Tienes 30 días para actuar.');
</script>
</body>
</html>
