<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Nadie se queda atrás</title>
<style>
:root{--bg:#10142a;--fg:#f4ecd8;--panel:#1f2547;--line:#f2b84b;--ac:#d4533b;--ac2:#3b86d4}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:"Courier New",Courier,monospace;font-weight:700;-webkit-tap-highlight-color:transparent}
canvas,.pix{image-rendering:pixelated;image-rendering:crisp-edges}
.px{background:var(--panel);border:3px solid var(--line);box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--line);padding:10px;margin:8px 6px}
.btn{font:inherit;background:var(--ac);color:var(--onac,#fff);border:3px solid #000;padding:8px 12px;cursor:pointer;box-shadow:3px 3px 0 #000;text-transform:uppercase;letter-spacing:.5px;margin:3px}
.btn:active{transform:translate(3px,3px);box-shadow:none}
.btn.alt{background:var(--ac2)}.btn.dim{background:#555;color:#ddd}.btn.sel{outline:3px solid #fff;outline-offset:1px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
h1,h2,h3{margin:.3em 0;text-transform:uppercase;letter-spacing:1px}
h1{font-size:clamp(22px,5vw,34px)}h2{font-size:clamp(16px,3.5vw,22px)}
p{margin:.5em 0;line-height:1.35}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.bar{height:12px;background:#0007;border:2px solid #000;position:relative}.bar>i{display:block;height:100%;background:var(--ac);transition:width .3s}
.hide{display:none!important}
.tag{display:inline-block;border:2px solid #000;padding:0 5px;font-size:12px;background:var(--ac2);color:#fff;margin:1px}
.wrap{max-width:920px;margin:0 auto;padding:10px}
.small{font-size:12px;opacity:.85}
.center{text-align:center}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
.ov>.px{max-width:560px;width:100%;max-height:92vh;overflow:auto}
canvas.fit{width:100%;height:auto;display:block}
.good{color:#6fe08a}.bad{color:#ff7a7a}.warn{color:#ffd86b}
a{color:var(--ac2)}
@media(max-width:600px){.btn{padding:10px 9px;font-size:13px}.px{padding:8px}}

html,body{overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#c{width:min(100vw,calc((100vh - 84px)*5/3));height:auto;aspect-ratio:5/3;background:#000;border:3px solid var(--line)}
#pad{display:flex;gap:6px;width:min(100vw,calc((100vh - 84px)*5/3));padding:6px 0 0}
#pad .btn{height:62px;font-size:16px;padding:0;border-radius:0}
#pad .mv{flex:1}#pad .wd{flex:1.7}
.btn.d{transform:translate(3px,3px);box-shadow:none;filter:brightness(1.3)}
.lv{display:block;width:100%;text-align:left;margin:6px 0}
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="320" height="192"></canvas>
<div id="pad"><button class="btn mv" data-k="L">◀</button><button class="btn mv" data-k="R">▶</button><button class="btn wd" data-k="J">SALTAR</button><button class="btn wd" data-k="Q">LEVANTAR</button><button class="btn wd" data-k="S">CAMBIAR</button></div></div>
<div class="ov" id="ovl"><div class="px center" id="ovc"></div></div>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
function h(tag,at,...kids){const e=document.createElement(tag);if(at)for(const k in at){const v=at[k];if(k==='class')e.className=v;else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);else if(k==='html')e.innerHTML=v;else if(v!==false&&v!=null)e.setAttribute(k,v);}for(const c of kids.flat(9))if(c!=null&&c!==false)e.append(c.nodeType?c:document.createTextNode(c));return e;}
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
let AC=null,MUTE=false;
function beep(f,d=.08,t='square',v=.04,f2){if(MUTE)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;if(f2)o.frequency.exponentialRampToValueAtTime(f2,AC.currentTime+d);g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d);}catch(e){}}
function noise(d=.08,v=.05,hp=800){if(MUTE)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=hp;const g=AC.createGain();g.gain.value=v;s.connect(f);f.connect(g);g.connect(AC.destination);s.start();}catch(e){}}
function spr(rows,pal,sc){const w=Math.max(...rows.map(r=>r.length)),hh=rows.length,c=document.createElement('canvas');c.width=w;c.height=hh;const x=c.getContext('2d');rows.forEach((r,j)=>[...r].forEach((ch,i)=>{if(pal[ch]){x.fillStyle=pal[ch];x.fillRect(i,j,1,1);}}));c.style.width=w*sc+'px';c.style.height=hh*sc+'px';c.className='pix';return c;}
function drawSpr(ctx,rows,pal,x,y,sc=1,flip){rows.forEach((r,j)=>[...r].forEach((ch,i)=>{if(pal[ch]){ctx.fillStyle=pal[ch];const ii=flip?r.length-1-i:i;ctx.fillRect(x+ii*sc,y+j*sc,sc,sc);}}));}
function store(k,v){try{if(v===undefined){const s=localStorage.getItem(k);return s?JSON.parse(s):null;}localStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}}
const _tc=document.createElement('canvas'),_tx=_tc.getContext('2d',{willReadFrequently:true}),_pc={};
function ptext(c,txt,x,y,px,col,al){const key=txt+'|'+px+'|'+col;let m=_pc[key];if(!m){_tx.font='bold '+px+'px "Courier New",Courier,monospace';const w=Math.ceil(_tx.measureText(txt).width)+2,hh=px+4;_tc.width=w;_tc.height=hh;_tx.font='bold '+px+'px "Courier New",Courier,monospace';_tx.textBaseline='top';_tx.fillStyle='#000';_tx.fillText(txt,1,1);const d=_tx.getImageData(0,0,w,hh).data,o=document.createElement('canvas');o.width=w;o.height=hh;const ox=o.getContext('2d'),im=ox.createImageData(w,hh);const cc=document.createElement('canvas').getContext('2d');cc.fillStyle=col;cc.fillRect(0,0,1,1);const rgb=cc.getImageData(0,0,1,1).data;for(let i=0;i<w*hh;i++){if(d[i*4+3]>110){im.data[i*4]=rgb[0];im.data[i*4+1]=rgb[1];im.data[i*4+2]=rgb[2];im.data[i*4+3]=255;}}ox.putImageData(im,0,0);m=_pc[key]=o;}c.drawImage(m,Math.round(x-(al==='c'?m.width/2:al==='r'?m.width:0)),Math.round(y));return m.width;}
function toast(msg,ms=1800){const t=h('div',{class:'px',style:'position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:99;max-width:90vw;background:#111;color:#fff'},msg);document.body.append(t);setTimeout(()=>t.remove(),ms);}
function modal(content,onclose){const o=h('div',{class:'ov'},h('div',{class:'px'},content));document.body.append(o);o.close=()=>{o.remove();onclose&&onclose();};return o;}

const TS=16,COLS=20,ROWS=12,W=320,H=192;
const cv=$('#c'),X=cv.getContext('2d');X.imageSmoothingEnabled=false;
const LV=[
 {n:'EL MURO',hint:'Fidel no salta: Mateo lo levanta (Q)|y lo lanza (Q otra vez). Cambiar: Tab o 1-4',rows:[
 '####################','#..................#','#..................#','#..................#','#..................#','#..................#','#..................#','#..................#','#..................#',
 '#.........#.....EEE#','#1234.....#.....EEE#','####################']},
 {n:'LA PUERTA',hint:'Mateo empuja la caja a la placa naranja.|Después, el pozo: ¡lanzad a Fidel!',rows:[
 '####################','#.......#..........#','#.......#..........#','#.......#..........#','#.......#..........#','#.......#..........#','#.......#..........#','#.......A..........#','#.......A..........#','#.......A........EE#','#1Ca#234A........EE#','############^^######']},
 {n:'LA URNA',hint:'La placa azul aguanta 6 segundos.|Alguien sube a pisarla… y baja corriendo.',rows:[
 '####################','#.......#.......#..#','#.......#.......#..#','#.......#.......#..#','#.......#.......#..#','#.......#.......#..#','#.......#.......#..#','#.......A...b...B..#','#.......A.#####.B..#','#.......A.......BEE#','#1Ca#234A.......BEE#','#########^^#########']}];
const CH=[
 {n:'MATEO',sp:78,jv:250,col:'#c0392b',skin:'#e0ac69',hair:'#3a2418',pants:'#2b3252'},
 {n:'NORA',sp:92,jv:312,col:'#2ea66a',skin:'#f2c6a0',hair:'#6b3fa0',pants:'#3a3a52'},
 {n:'ADA',sp:100,jv:250,col:'#e8c53b',skin:'#8d5524',hair:'#222',pants:'#8a5a1a'},
 {n:'FIDEL',sp:54,jv:182,col:'#3b86d4',skin:'#f2c6a0',hair:'#cfcfcf',pants:'#4a4a5a'}];
let S=null,keys={L:0,R:0,J:0},jEdge=false,best=+store('nsqa_best')||0;
const bg=(()=>{const r=rng(5),a=[];let x=0;while(x<W){const w=14+Math.floor(r()*22),h=30+Math.floor(r()*80);a.push({x,w,h,seed:r()});x+=w+2;}return a;})();
function load(i){const L=LV[i],map=L.rows.map(r=>[...r]),ch=[],crates=[],plates=[];
  map.forEach((row,ty)=>row.forEach((c,tx)=>{
    if('1234'.includes(c)){const k=+c-1;ch[k]={k,...CH[k],x:tx*TS+3,y:ty*TS+TS-14,w:10,h:14,vx:0,vy:0,rx:0,ry:0,face:1,grounded:false,coy:0,buf:0,carrier:null,carry:null,sx:tx*TS+3,sy:ty*TS+TS-14,at:false};row[tx]='.';}
    else if(c==='C'){crates.push({x:tx*TS,y:ty*TS,w:16,h:16,vy:0,ry:0,rx:0});row[tx]='.';}
    else if(c==='a'||c==='b'){plates.push({c:c,tx,ty,t:0,hold:c==='a'?.15:6});row[tx]='.';}}));
  const ex=[];map.forEach((row,ty)=>row.forEach((c,tx)=>{if(c==='E')ex.push([tx,ty]);}));
  const exit={x:Math.min(...ex.map(e=>e[0]))*TS,y:Math.min(...ex.map(e=>e[1]))*TS,x2:(Math.max(...ex.map(e=>e[0]))+1)*TS,y2:(Math.max(...ex.map(e=>e[1]))+1)*TS};
  S={lv:i,map,ch,crates,plates,exit,act:0,open:{A:false,B:false},t:0,mode:'play',winT:0,parts:[],hintT:9,deaths:0,total:S?S.total:0};
  $('#ovl').classList.add('hide');}
function solidAt(tx,ty){if(tx<0||tx>=COLS||ty<0)return true;if(ty>=ROWS)return false;const c=S.map[ty][tx];return c==='#'||c==='^'||(c==='A'&&!S.open.A)||(c==='B'&&!S.open.B);}
function tilesHit(x,y,w,h){for(let ty=Math.floor(y/TS);ty<=Math.floor((y+h-.001)/TS);ty++)for(let tx=Math.floor(x/TS);tx<=Math.floor((x+w-.001)/TS);tx++)if(solidAt(tx,ty))return true;return false;}
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function crateHit(e,self){for(const c of S.crates)if(c!==self&&ov(e,c))return c;return null;}
function moveX(e,dx,isCh){e.rx+=dx;const n=Math.trunc(e.rx);e.rx-=n;const s=Math.sign(n);
  for(let i=0;i<Math.abs(n);i++){e.x+=s;
    if(tilesHit(e.x,e.y,e.w,e.h)){e.x-=s;e.vx=0;return;}
    if(isCh){const c=crateHit(e);if(c){
      if(e.k===0){c.x+=s;if(tilesHit(c.x,c.y,c.w,c.h)||crateHit(c,c)||false){c.x-=s;e.x-=s;e.vx=0;return;}if(ov(e,c)){c.x-=s;e.x-=s;e.vx=0;return;}}
      else{e.x-=s;e.vx=0;return;}}}}}
function moveY(e,dy,isCh){e.ry+=dy;const n=Math.trunc(e.ry);e.ry-=n;const s=Math.sign(n);let hit=false;
  for(let i=0;i<Math.abs(n);i++){e.y+=s;let b=tilesHit(e.x,e.y,e.w,e.h);
    if(!b&&isCh&&crateHit(e))b=true;
    if(!b&&isCh&&s>0){for(const o of S.ch)if(o!==e&&e.x<o.x+o.w&&e.x+e.w>o.x&&e.y-1+e.h<=o.y&&e.y+e.h>o.y){b=true;break;}}
    if(b){e.y-=s;if(s>0)hit=true;e.vy=0;break;}}
  return hit;}
function die(c){S.deaths++;burst(c.x+5,c.y+7,'#ff6a5a');beep(150,.25,'sawtooth',.06,60);
  if(c.carrier){c.carrier.carry=null;c.carrier=null;}if(c.carry){c.carry.carrier=null;c.carry=null;}
  c.x=c.sx;c.y=c.sy;c.vx=c.vy=0;c.rx=c.ry=0;}
function burst(x,y,col){for(let i=0;i<10;i++)S.parts.push({x,y,vx:(Math.random()-.5)*120,vy:-Math.random()*110,t:.6,c:col});}
function lift(){const m=S.ch[S.act];if(m.k!==0){toast('Sólo Mateo puede levantar');return;}
  if(m.carry){const c=m.carry;m.carry=null;c.carrier=null;c.vx=m.face*130;c.vy=-250;c.y=m.y-c.h-1;beep(520,.1,'square',.05,780);return;}
  let b=null,bd=99;for(const o of S.ch){if(o===m||o.carrier||o.carry)continue;const dx=Math.abs((o.x+o.w/2)-(m.x+m.w/2)),dy=Math.abs(o.y-m.y);if(dx<20&&dy<10&&dx<bd){bd=dx;b=o;}}
  if(b){m.carry=b;b.carrier=m;b.vx=b.vy=0;beep(380,.1,'square',.05,520);}}
function sw(i){if(!S||S.mode!=='play')return;S.act=((i%4)+4)%4;beep(660,.04,'square',.03);}
function update(dt){if(!S||S.mode!=='play'&&S.mode!=='won')return;S.t+=dt;S.hintT-=dt;
  const a=S.ch[S.act];
  for(const c of S.ch){
    if(c.carrier){const m=c.carrier;c.x=m.x+(m.w-c.w)/2;c.y=m.y-c.h;c.vx=c.vy=0;c.grounded=true;
      if(c===a&&jEdge){m.carry=null;c.carrier=null;c.vy=-c.jv;c.vx=0;beep(500,.08,'square',.04,800);}
      continue;}
    const tgt=c===a&&S.mode==='play'?(keys.R-keys.L)*c.sp:0;if(tgt)c.face=tgt>0?1:-1;
    c.vx+=(tgt-c.vx)*Math.min(1,dt*20);
    c.coy=c.grounded?.09:c.coy-dt;c.buf=(c===a&&jEdge)?.1:c.buf-dt;
    if(c.buf>0&&c.coy>0){c.vy=-c.jv;c.buf=c.coy=0;c.grounded=false;beep(c.k===1?560:420,.07,'square',.035,c.k===1?820:620);}
    c.vy+=900*dt;if(c.vy>420)c.vy=420;
    if(c.k===2&&c===a&&keys.J&&c.vy>55&&!c.grounded)c.vy=55;
    moveX(c,c.vx*dt,true);c.grounded=moveY(c,c.vy*dt,true)||false;
    // muerte
    const fx=Math.floor((c.x+c.w/2)/TS),fy=Math.floor((c.y+c.h)/TS);
    if((c.grounded&&S.map[fy]&&S.map[fy][fx]==='^')||c.y>H+30)die(c);}
  for(const c of S.crates){c.vy+=900*dt;if(c.vy>380)c.vy=380;c.ry+=c.vy*dt;const n=Math.trunc(c.ry);c.ry-=n;
    for(let i=0;i<Math.abs(n);i++){c.y+=Math.sign(n);if(tilesHit(c.x,c.y,c.w,c.h)){c.y-=Math.sign(n);c.vy=0;break;}}}
  // placas y puertas
  const want={A:false,B:false};
  for(const p of S.plates){const r={x:p.tx*TS+2,y:p.ty*TS+9,w:12,h:7};
    const act=S.ch.some(c=>ov(c,r))||S.crates.some(c=>ov(c,r));
    const was=p.t>0;if(act)p.t=p.hold;else p.t=Math.max(0,p.t-dt);
    if(p.t>0&&!was)beep(300,.15,'square',.05,600);want[p.c==='a'?'A':'B']=want[p.c==='a'?'A':'B']||p.t>0;}
  for(const L of ['A','B']){let o=want[L];
    if(!o&&S.open[L]){for(let ty=0;ty<ROWS;ty++)for(let tx=0;tx<COLS;tx++)if(S.map[ty][tx]===L&&S.ch.some(c=>ov(c,{x:tx*TS,y:ty*TS,w:TS,h:TS})))o=true;}
    if(o!==S.open[L]){S.open[L]=o;beep(o?700:240,.12,'triangle',.05);}}
  // salida
  let n=0;for(const c of S.ch){const cx=c.x+c.w/2,cy=c.y+c.h/2;c.at=cx>S.exit.x&&cx<S.exit.x2&&cy>S.exit.y&&cy<S.exit.y2;if(c.at)n++;}
  if(n===4&&S.mode==='play'){S.winT+=dt;if(S.winT>.7)win();}else if(S.mode==='play')S.winT=0;
  for(const p of S.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;p.t-=dt;}S.parts=S.parts.filter(p=>p.t>0);
  if(S.mode==='won'){S.wonT-=dt;if(S.wonT<=0){S.lv+1<LV.length?load(S.lv+1):ending();}}
  jEdge=false;}
function win(){S.mode='won';S.wonT=1.6;S.total+=S.t;[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.18,'square',.05),i*110));
  for(let i=0;i<30;i++)S.parts.push({x:(S.exit.x+S.exit.x2)/2,y:S.exit.y+10,vx:(Math.random()-.5)*160,vy:-Math.random()*160,t:1.2,c:['#f2b84b','#d4533b','#3b86d4','#2ea66a'][i%4]});}
function ending(){S.mode='end';const t=Math.round(S.total);if(!best||t<best){best=t;store('nsqa_best',best);}
  const o=$('#ovc');o.innerHTML='';
  o.append(h('h1',{},'¡ENTRE TODOS!'),h('p',{},'Los cuatro llegaron a la urna. Nadie se quedó atrás.'),
   h('p',{class:'small'},'Tiempo '+t+' s · Caídas '+S.deaths+' · Récord '+best+' s'),
   h('button',{class:'btn',onclick:()=>load(0)},'↺ Jugar otra vez'),h('button',{class:'btn dim',onclick:menu},'Niveles'));
  $('#ovl').classList.remove('hide');}
function menu(){const o=$('#ovc');o.innerHTML='';S=S||null;
  o.append(h('h1',{},'NADIE SE QUEDA ATRÁS'),h('p',{},'Cuatro vecinos, una urna. Los cuatro tienen que llegar. Mateo levanta y empuja, Nora salta alto, Ada planea (mantén SALTAR) y Fidel… necesita a los demás.'),
   h('p',{class:'small'},'← → mover · ↑/Espacio saltar · Q levantar/lanzar · Tab o 1-4 cambiar · R reiniciar'));
  LV.forEach((l,i)=>o.append(h('button',{class:'btn lv',onclick:()=>{S=null;load(i);}},(i+1)+'. '+l.n)));
  $('#ovl').classList.remove('hide');}
// ---------- dibujo ----------
function R(c,x,y,w,h2){X.fillStyle=c;X.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h2));}
function drawBg(t){const g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1a1f4a');g.addColorStop(.7,'#5a2f5e');g.addColorStop(1,'#a8504a');X.fillStyle=g;X.fillRect(0,0,W,H);
  for(let i=0;i<30;i++)R('rgba(255,255,255,.5)',(i*37)%W,(i*23)%80,1,1);
  bg.forEach(b=>{R('#2a1f3d',b.x,H-b.h-16,b.w,b.h+16);for(let wy=H-b.h-10;wy<H-20;wy+=8)for(let wx=b.x+2;wx<b.x+b.w-3;wx+=6)if(((wx*7+wy*3)|0)%5<2)R('#ffd88a88',wx,wy,3,3);});}
function drawTiles(t){
