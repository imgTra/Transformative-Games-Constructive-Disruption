<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Devuelve el Dinero</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Layout: arcade cabinet in one column. Screen on top, thumb pad below, key legend last. Single dark arcade look by choice. */
:root{
  --night:#14172e; --panel:#23296a; --ink:#f6f1e3; --coin:#ffc93c; --alarm:#ff4a3d; --civic:#35c6f4; --muted:#a9b2e8; --edge:#0b0d1f;
  --px:'Press Start 2P', ui-monospace, 'Courier New', monospace;
  color-scheme: dark;
}
*{box-sizing:border-box}
body{
  background:var(--night); color:var(--ink); font-family:var(--px); margin:0;
  padding-block:14px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
}
.cab{max-width:768px; margin:0 auto; display:flex; flex-direction:column; gap:16px}
.bezel{background:var(--panel); padding:6px; border:4px solid var(--edge); box-shadow:0 0 0 3px var(--coin), 6px 6px 0 3px var(--edge)}
canvas{display:block; width:100%; aspect-ratio:256/224; background:#000; touch-action:none}
.pad{display:flex; justify-content:space-between; align-items:center; gap:12px; touch-action:none}
.stick{flex:1 1 0; min-width:0; max-width:320px; height:92px; display:flex; background:var(--panel); border:3px solid var(--edge); box-shadow:0 5px 0 var(--edge); touch-action:none; cursor:pointer; -webkit-tap-highlight-color:transparent}
.stick span{flex:1 1 0; display:flex; align-items:center; justify-content:center; font-size:26px; color:var(--muted); pointer-events:none}
.stick span.mid{flex:0 0 20%; background:var(--night); opacity:.5}
.stick span.on{background:var(--civic); color:var(--edge)}
.grp{display:flex; gap:10px}
.k{
  font-family:var(--px); font-size:11px; width:88px; height:92px; padding:0;
  background:var(--civic); color:var(--edge); border:3px solid var(--edge); border-radius:0;
  box-shadow:0 5px 0 var(--edge); touch-action:none; cursor:pointer; -webkit-tap-highlight-color:transparent;
}
.k.fire{background:var(--alarm); color:#fff}
.k.jump{background:var(--coin)}
.k:active,.k.on{transform:translateY(5px); box-shadow:none}
.k:focus-visible,.mini:focus-visible{outline:3px solid #fff; outline-offset:2px}
.legend{font-size:8px; line-height:1.9; color:var(--muted); display:flex; justify-content:space-between; gap:10px 16px; flex-wrap:wrap; align-items:flex-start}
.legend p{margin:0; min-width:0}
.mini{font-family:var(--px); font-size:8px; background:transparent; color:var(--ink); border:2px solid var(--muted); padding:8px 10px; cursor:pointer}
@media (max-width:420px){ .k{width:70px; height:84px; font-size:9px} .stick{height:84px} .pad{gap:8px} .grp{gap:6px} }
</style>

<div class="cab">
  <div class="bezel"><canvas id="c" aria-label="Pantalla del juego Devuelve el Dinero"></canvas></div>
  <div class="pad">
    <div class="stick" id="stick" aria-label="Mover izquierda y derecha: desliza el dedo">
      <span id="zl">&lt;</span><span class="mid"></span><span id="zr">&gt;</span>
    </div>
    <div class="grp">
      <button class="k jump" data-k="j">SALTA</button>
      <button class="k fire" data-k="s">GRITA</button>
    </div>
  </div>
  <div class="legend">
    <p>FLECHAS: MOVER<br>ARRIBA / Z: SALTAR (2 VECES)<br>CAER ENCIMA: GOLPEAR<br>ESPACIO / X: GRITAR</p>
    <button class="mini" id="snd">SONIDO: SI</button>
  </div>
</div>
<script>
(()=>{
'use strict';
const W=256,H=224,GY=208,S=3;
const FONT='"Press Start 2P", ui-monospace, "Courier New", monospace';
const cv=document.getElementById('c');
let ctx=cv.getContext('2d');const mainCtx=ctx;
cv.width=W*S;cv.height=H*S;
const rnd=(a,b)=>a+Math.random()*(b-a);
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const INK='#10101c';
const R=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)};
const O=(x,y,w,h,c)=>{R(x-1,y-1,w+2,h+2,INK);R(x,y,w,h,c)};
const T=(s,x,y,c,al,sz)=>{ctx.font=(sz||8)+'px '+FONT;ctx.textAlign=al||'left';ctx.textBaseline='top';ctx.fillStyle=c;ctx.fillText(s,Math.round(x),Math.round(y))};
const TO=(s,x,y,c,al,sz)=>{for(const d of [[-1,0],[1,0],[0,-1],[0,1],[1,1]])T(s,x+d[0],y+d[1],INK,al,sz);T(s,x,y,c,al,sz)};
const poly=(p,c)=>{ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)ctx.lineTo(p[i],p[i+1]);ctx.closePath();ctx.fill()};
const circ=(x,y,r,c)=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()};

/* ---------- sonido ---------- */
let AC=null,snd=true;
function beep(f,d,type,v,slide){
  if(!snd)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
    o.type=type||'square';o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);
    g.gain.setValueAtTime(v||.04,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}
const sndBtn=document.getElementById('snd');
function toggleSnd(){snd=!snd;sndBtn.textContent='SONIDO: '+(snd?'SI':'NO')}
sndBtn.addEventListener('click',toggleSnd);

/* ---------- entrada ---------- */
const K={l:0,r:0,j:0,s:0},prev={j:0};
const KM={ArrowLeft:'l',a:'l',A:'l',ArrowRight:'r',d:'r',D:'r',ArrowUp:'j',w:'j',W:'j',z:'j',Z:'j',' ':'s',x:'s',X:'s',j:'s',J:'s'};
addEventListener('keydown',e=>{
  const k=KM[e.key];
  if(k){K[k]=1;e.preventDefault();if(!e.repeat)anyPress();}
  else if(e.key==='Enter'&&!e.repeat)anyPress();
  else if(e.key==='m'||e.key==='M')toggleSnd();
});
addEventListener('keyup',e=>{const k=KM[e.key];if(k)K[k]=0});
/* cruceta deslizable: el dedo puede cambiar de lado sin soltar */
const stick=document.getElementById('stick'),zl=document.getElementById('zl'),zr=document.getElementById('zr');
let sid=null;
function stickSet(e){
  const r=stick.getBoundingClientRect(),f=(e.clientX-r.left)/r.width;
  K.l=f<.4?1:0;K.r=f>.6?1:0;
  zl.classList.toggle('on',!!K.l);zr.classList.toggle('on',!!K.r);
}
function stickOff(e){
  if(e.pointerId!==sid)return;
  sid=null;K.l=0;K.r=0;zl.classList.remove('on');zr.classList.remove('on');
}
stick.addEventListener('pointerdown',e=>{
  e.preventDefault();sid=e.pointerId;
  try{stick.setPointerCapture(e.pointerId)}catch(_){}
  stickSet(e);anyPress();
});
stick.addEventListener('pointermove',e=>{if(e.pointerId===sid){e.preventDefault();stickSet(e)}});
['pointerup','pointercancel','lostpointercapture'].forEach(t=>stick.addEventListener(t,stickOff));
stick.addEventListener('contextmenu',e=>e.preventDefault());
/* botones: capturan el dedo, no se sueltan al deslizar */
document.querySelectorAll('.k').forEach(b=>{
  const k=b.dataset.k;let bid=null;
  b.addEventListener('pointerdown',e=>{
    e.preventDefault();bid=e.pointerId;
    try{b.setPointerCapture(e.pointerId)}catch(_){}
    K[k]=1;b.classList.add('on');anyPress();
  });
  const off=e=>{if(e.pointerId!==bid)return;bid=null;K[k]=0;b.classList.remove('on')};
  ['pointerup','pointercancel','lostpointercapture'].forEach(t=>b.addEventListener(t,off));
  b.addEventListener('contextmenu',e=>e.preventDefault());
});
cv.addEventListener('pointerdown',e=>{e.preventDefault();try{window.focus()}catch(_){}anyPress()});
/* soltar todo si se pierde el foco */
const clearAll=()=>{K.l=K.r=K.j=K.s=0;zl.classList.remove('on');zr.classList.remove('on')};
addEventListener('blur',clearAll);
document.addEventListener('visibilitychange',()=>{if(document.hidden)clearAll()});
/* mando físico */
let gpOn=false;
function pollPad(){
  let g=null;
  try{g=(navigator.getGamepads?navigator.getGamepads():[])[0]}catch(_){}
  if(!g){gpOn=false;return}
  const b=i=>!!(g.buttons[i]&&g.buttons[i].pressed),ax=g.axes[0]||0;
  const l=ax<-.4||b(14),r=ax>.4||b(15),j=b(0)||b(12),s=b(1)||b(2)||b(7);
  const any=l||r||j||s;
  if(any||gpOn){
    if(any&&!gpOn)anyPress();
    K.l=l?1:0;K.r=r?1:0;K.j=j?1:0;K.s=s?1:0;
  }
  gpOn=any;
}

/* ---------- datos ---------- */
const SEC=[
 {n:'EDUCACIÓN',bg:['#1c3aa8','#2f56d6','#4a7cf0'],pl:'#2fb7e8',pt:'#a8f2ff',bo:'DON RECORTE',hp:30,
  sg:[['ESCUELA','PÚBLICA'],['MÁS','PROFES'],['PAGA','LO QUE','ROBAS'],['LIBROS','NO','SOBRES']]},
 {n:'SANIDAD',bg:['#0f5e46','#17865f','#2fb58a'],pl:'#ff7f9e',pt:'#ffc6d4',bo:'DR. PRIVATIZA',hp:40,
  sg:[['SANIDAD','PÚBLICA'],['MÁS','MÉDICOS'],['SALUD','PARA','TODOS'],['NO ES','UN','NEGOCIO']]},
 {n:'VIVIENDA',bg:['#5a2392','#7c37c2','#a357e6'],pl:'#ff9f3d',pt:'#ffdca0',bo:'EL CASERO MAYOR',hp:50,
  sg:[['VIVIENDA','DIGNA'],['ALQUILER','JUSTO'],['UN HOGAR','ES UN','DERECHO'],['CASAS','PARA','VIVIR']]},
 {n:'ENERGÍA',bg:['#4a2a0a','#8a5212','#d08a1c'],pl:'#ffe14a',pt:'#fff7b0',bo:'MR. PUERTA GIRATORIA',hp:60,
  sg:[['LUZ SIN','ABUSOS'],['ENERGÍA','PARA','TODOS'],['FUERA','LOBBIES'],['LUZ ES','UN','DERECHO']]}];
const LAY=[
 [[16,168,80],[160,168,80],[0,128,56],[100,128,56],[200,128,56],[40,88,72],[144,88,72],[96,48,64]],
 [[0,168,64],[96,168,64],[192,168,64],[32,128,64],[160,128,64],[0,88,56],[100,88,56],[200,88,56],[60,48,136]],
 [[8,168,104],[144,168,104],[72,128,112],[0,88,64],[192,88,64],[64,48,128]],
 [[0,168,48],[104,168,48],[208,168,48],[48,128,48],[160,128,48],[0,88,48],[104,88,48],[208,88,48],[48,48,48],[160,48,48]]];
const BLAY=[[16,160,56],[184,160,56],[88,112,80]];
const TYPES=[[0,0,0,1],[0,1,1,0],[1,1,0,2],[2,1,0,2]];
const COUNT=[5,6,7,8];
const ATK=[['throw','spawn'],['throw','jump','spawn'],['spawn','jump','throw'],['bolt','throw','jump','spawn']];
const WORDS=['LADRÓN','DEVUELVE','EL DINERO','DE TODOS','¡CORRUPTO!','¡FUERA!'];
const STAGES=[];for(let s=0;s<4;s++){STAGES.push({sec:s,boss:false});STAGES.push({sec:s,boss:true});}
const BSUIT=['#4b2a6a','#f2f2f2','#6a4a2a','#c8a020'],BTIE=['#ffd23f','#d33','#d33','#222'];
const ESUIT=[['#5a6a8a','#d33'],['#3d8a4f','#ffd23f'],['#e8b820','#222'],['#15171f','#ff4a3d']];

/* ---------- fondo estático ---------- */
const st=document.createElement('canvas');st.width=W*S;st.height=H*S;const stx=st.getContext('2d');
function emblem(k){
  if(k===0){poly([128,56,196,84,128,112,60,84],'#fff');R(104,100,48,24,'#fff');R(190,86,3,34,'#fff')}
  if(k===1){R(110,50,36,100,'#fff');R(78,82,100,36,'#fff')}
  if(k===2){poly([56,100,128,40,200,100],'#fff');R(76,100,104,64,'#fff')}
  if(k===3){poly([142,38,98,112,126,112,112,168,166,90,136,90],'#fff')}
}
function drawPlat(p,C,ground){
  const h=ground?16:8;
  R(p.x-1,p.y-1,p.w+2,h+(ground?1:2),INK);R(p.x,p.y,p.w,h,C.pl);R(p.x,p.y,p.w,2,C.pt);
  ctx.globalAlpha=.28;
  for(let i=8;i<p.w;i+=16)R(p.x+i,p.y+2,1,h-2,'#000');
  if(ground)R(p.x,p.y+8,p.w,1,'#000');
  R(p.x,p.y+h-2,p.w,2,'#000');
  ctx.globalAlpha=1;
}
function renderStatic(sec,plats){
  const C=SEC[sec];ctx=stx;ctx.setTransform(S,0,0,S,0,0);
  for(let i=0;i<14;i++)R(0,i*16,W,16,C.bg[i<5?0:i<10?1:2]);
  ctx.globalAlpha=.13;emblem(sec);
  ctx.globalAlpha=.16;let s=sec*7+3;
  for(let i=0;i<7;i++){s=(s*37+11)%97;const x=(s*5+i*40)%W,y=20+(s*3)%150;R(x,y,28,6,'#fff');R(x+5,y-4,16,4,'#fff')}
  ctx.globalAlpha=1;
  plats.forEach((p,i)=>drawPlat(p,C,i===0));
  ctx=mainCtx;
}

/* ---------- sprites ---------- */
function drawPlayer(p){
  if(p.inv>0&&!p.dead&&((G.t>>2)&1))return;
  const moving=p.on&&Math.abs(p.vx)>.1,fr=moving?((G.t>>3)&1):0;
  ctx.save();ctx.translate(Math.round(p.x+p.w/2),Math.round(p.y+p.h));
  if(p.dead){ctx.translate(0,-8);ctx.rotate(G.t*.3);ctx.translate(0,8)}
  if(p.dj&&!p.on&&!p.dead){ctx.translate(0,-9);ctx.rotate(G.t*.5*p.dir);ctx.translate(0,9)}
  ctx.scale(p.dir,1);
  O(-4,-3,3,3+fr,'#2a3a8a');O(1,-3,3,3+(1-fr),'#2a3a8a');
  O(-5,-10,10,8,'#ffd23f');R(-5,-6,10,1,'#d9a800');
  O(-6,-18,12,9,'#f0b88a');R(-6,-18,12,3,'#6b3a1a');R(-6,-14,12,2,'#e23b3b');
  R(2,-12,2,3,INK);R(4,-9,2,1,'#a33');
  if(K.s||p.cd>6){O(5,-11,6,4,'#d8d8e0');O(10,-13,2,8,'#8a8a98')}
  else O(5,-9,3,3,'#f0b88a');
  ctx.restore();
}
function drawPol(ox,oy,sx,sy,dir,suit,tie,fr,bk,gl){
  ctx.save();ctx.translate(Math.round(ox),Math.round(oy));ctx.scale(dir*sx,sy);
  O(-5,-3,4,3+fr,'#1b1b24');O(1,-3,4,3+(1-fr),'#1b1b24');
  O(-6,-10,12,8,suit);R(-1,-10,2,8,'#fff');R(-1,-9,2,6,tie);
  O(-6,-18,12,9,'#f3c6a0');R(-6,-18,12,3,'#3a2a20');
  R(1,-14,4,3,'#fff');R(3,-14,2,3,INK);R(0,-16,6,1,INK);R(1,-11,4,1,'#a33');
  if(gl){R(0,-15,7,4,INK);R(1,-15,2,1,'#7ad')}
  O(5,-9,6,6,'#c8a050');R(7,-8,2,3,'#ffd23f');
  if(bk===0){R(-8,-21,16,2,INK);R(-5,-24,10,3,INK);R(6,-21,1,6,'#ffd23f')}
  if(bk===1){R(0,-13,6,4,'#9fe');R(-6,-21,12,3,'#cfe');R(-3,-20,2,2,'#d33')}
  if(bk===2){R(-7,-22,14,5,'#ffd23f');R(-8,-18,16,1,'#d9a800');R(-9,-8,3,3,'#ffd23f')}
  if(bk===3){R(-5,-27,10,9,INK);R(-8,-19,16,2,INK);R(-5,-21,10,2,'#ffd23f');circ(0,-29,3,'#fff6a0')}
  ctx.restore();
}
function coatFx(ox,oy,coat){
  ctx.save();ctx.translate(Math.round(ox),Math.round(oy));
  const rx=coat===1?7:9,ry=coat===1?6:10,cy=coat===1?-4:-9;
  ctx.fillStyle='#eaf3ff';ctx.strokeStyle='#4a6fd0';ctx.lineWidth=1;
  ctx.beginPath();ctx.ellipse(0,cy,rx,ry,0,0,7);ctx.fill();ctx.stroke();
  T('€',0,cy-3,'#d22','center',6);
  ctx.restore();
}
function drawBall(e){
  ctx.save();ctx.translate(Math.round(e.x+e.w/2),Math.round(e.y+e.h-8));
  if(e.st==='ball'&&e.bt>360)ctx.translate(Math.sin(e.bt)*1.5,0);
  ctx.rotate(e.st==='roll'?e.rt*.25:0);
  circ(0,0,9,'#4a6fd0');circ(0,0,8,'#eaf3ff');
  R(-6,-2,12,1,'#b8c8ee');R(-4,3,9,1,'#b8c8ee');R(-1,-8,2,4,'#d22');R(-2,-1,4,2,'#d22');
  ctx.restore();
}
function drawSwept(e){
  ctx.save();ctx.translate(Math.round(e.x+e.w/2),Math.round(e.y+e.h-7));
  ctx.rotate(e.dir*G.t*.18);
  O(-8,-6,16,12,'#f4f0e0');
  R(-6,-4,12,2,'#222');R(-6,0,8,1,'#777');R(-6,2,10,1,'#777');R(2,-1,4,4,'#9ab');
  R(-3,-9,6,4,'#f3c6a0');R(-3,-9,6,1,'#3a2a20');
  ctx.restore();
}
function drawNews(){
  for(const p of news){
    ctx.save();ctx.translate(Math.round(p.x+5),Math.round(p.y+2));ctx.rotate(p.rot);
    if(p.photo){
      R(-7,-6,14,12,INK);R(-6,-5,12,10,'#f4f0e0');R(-5,-4,10,7,['#7ab','#a97','#8a8'][p.shade]);
      circ(0,-1,2,'#f3c6a0');R(-3,1,6,2,'#334');
    }else{
      const w=p.t.length*4+4,h=w/2;
      R(-h-1,-7,w+2,14,INK);R(-h,-6,w,12,'#f4f0e0');
      T(p.t,0,-5,'#111','center',4);
      R(-h+2,0,w-4,1,'#888');R(-h+2,2,w-4,1,'#888');R(-h+2,4,w-7,1,'#888');
    }
    ctx.restore();
  }
}
function drawJail(){
  for(let s=0;s<2;s++){
    const j=jail[s],x0=s?W-14:0,top=GY-40,bar=j.f>0&&(j.f&1)?'#fff':'#c4c8d8';
    R(x0,top,14,40,'#1c1e34');
    for(let i=0;i<j.n;i++){
      const y=GY-3-i*13;
      circ(x0+7,y-8,3,'#f3c6a0');R(x0+3,y-5,8,5,'#f2f2f2');
      for(let k=0;k<4;k++)R(x0+3,y-5+k*2,8,1,'#222');
    }
    R(x0,top,14,2,bar);R(x0,top+19,14,2,bar);
    for(let i=0;i<5;i++)R(x0+1+i*3,top,1,40,bar);
    R(s?x0:x0+13,top,1,40,INK);
  }
}
function drawEnemy(e){
  if(e.st==='swept'){drawSwept(e);return}
  const fr=e.on?((G.t>>3)&1):0,c=ESUIT[e.ty];
  drawPol(e.x+e.w/2,e.y+e.h,.9,.9,e.dir,c[0],c[1],fr,-1,e.ty===3);
  if(e.coat)coatFx(e.x+e.w/2,e.y+e.h,e.coat);
}
function drawBoss(b){
  if(b.flash&&(b.flash&1))return;
  drawPol(b.x+b.w/2,b.y+b.h,2,2.1,b.dir,BSUIT[b.sec],BTIE[b.sec],b.on&&((G.t>>4)&1)?1:0,b.sec);
  /* recortes de prensa pegados: el jefe se deteriora según pierde vida */
  const d=1-b.hp/b.max,n=Math.min(8,Math.floor(d*9)),cx=b.x+b.w/2,cy=b.y+b.h;
  const SP=[[-11,-8,.4],[8,-26,-.5],[-9,-24,.2],[11,-12,-.3],[-2,-34,.6],[2,-18,-.2],[-12,-33,-.6],[9,-5,.5]];
  for(let i=0;i<n;i++){
    const s=SP[i];ctx.save();ctx.translate(Math.round(cx+s[0]),Math.round(cy+s[1]));ctx.rotate(s[2]);
    R(-5,-4,10,8,INK);R(-4,-3,8,6,'#f4f0e0');R(-3,-2,6,1,'#222');R(-3,0,6,1,'#888');R(-3,2,4,1,'#888');
    ctx.restore();
  }
  if(d>.5)circ(cx+13,cy-30+((G.t>>3)&3),1.6,'#9ef');

const G={state:'title',stage:0,score:0,lives:3,ret:0,t:0,wi:0,pulse:0,shake:0,vt:0};

}
function anyPress(){
  if(G.state==='title'){G.score=0;G.lives=3;G.ret=0;startStage(0)}
  else if(G.state==='over'&&G.vt>30){G.lives=3;startStage(G.stage)}

/* ---------- física ---------- */
function phys(e,pl){
  pl=pl||plats;const pb=e.y+e.h;
  e.x+=e.vx;e.wall=0;
  if(e.x<14){e.x=14;e.wall=-1}else if(e.x+e.w>W-14){e.x=W-14-e.w;e.wall=1}
  e.vy=Math.min(e.vy+.28,6.5);e.y+=e.vy;e.on=false;
  if(e.vy>=0)for(const p of pl){
    if(e.x+e.w>p.x&&e.x<p.x+p.w&&pb<=p.y+.01&&e.y+e.h>=p.y){e.y=p.y-e.h;e.vy=0;e.on=true;break}
  }
}
function sparks(x,y,n,c){for(let i=0;i<n;i++)parts.push({x,y,vx:rnd(-1.6,1.6),vy:rnd(-2.6,.4),life:rnd(14,26),c,s:2})}
function confetti(){
  if(G.t%2||parts.length>160)return;
  const cl=['#ff4a3d','#ffd23f','#35c6f4','#6fd37a','#fff','#c05ae8'];
  parts.push({x:rnd(0,W),y:-4,vx:rnd(-.5,.5),vy:rnd(.5,1.4),life:260,c:cl[(Math.random()*6)|0],s:3,g:.005});
}
function updParts(){for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g===undefined?.12:p.g;p.life--}parts=parts.filter(p=>p.life>0&&p.y<H+6)}

/* ---------- jugador ---------- */
function hurtPlayer(){
  if(P.dead||P.inv>0)return;
  G.lives--;P.dead=true;P.dt=70;P.vy=-4.5;P.vx=0;G.shake=10;
  beep(220,.3,'sawtooth',.06,-140);
}
function shoot(){
  const t=WORDS[G.wi++%WORDS.length],w=t.length*6+4;
  words.push({x:P.dir>0?P.x+9:P.x+1-w,y:P.y+3,w,h:9,vx:P.dir*3,vy:-.15,t,life:36});
  beep(520+rnd(0,120),.07,'square',.025,-200);
}
function updPlayer(){
  const p=P;
  if(p.dead){
    p.vy+=.2;p.y+=p.vy;
    if(--p.dt<=0){
      if(G.lives<=0){G.state='over';G.vt=0;beep(110,.6,'sawtooth',.06,-60)}
      else{P=newP();P.inv=120}
    }
    return;
  }
  const ax=(K.r?1:0)-(K.l?1:0);
  p.vx=ax*1.4;if(ax)p.dir=ax;
  /* salto con margen: pulsar un poco antes de aterrizar o justo después de salir de una plataforma */
  p.pby=p.y+p.h;
  const press=K.j&&!prev.j;
  if(press)p.jb=7;
  if(p.on){p.coy=6;p.dj=false}else if(p.coy>0)p.coy--;
  if(p.jb>0)p.jb--;
  if(p.jb>0&&p.coy>0){p.vy=-5.5;p.jb=0;p.coy=0;beep(420,.1,'square',.03,300)}
  else if(press&&!p.on&&p.coy<=0&&!p.dj){
    p.vy=-5;p.dj=true;p.jb=0;p.nc=0;
    sparks(p.x+5,p.y+16,8,'#fff');beep(620,.1,'square',.035,350);
  }
  if(p.nc>0)p.nc--;else if(!K.j&&p.vy<-2.5)p.vy=-2.5;
  phys(p);
  if(p.cd>0)p.cd--;
  if(K.s&&p.cd<=0){shoot();p.cd=13}
  if(p.inv>0)p.inv--;
}

/* ---------- enemigos ---------- */
function coatHit(e,dir){
  e.coat++;e.ct=150;e.stun=14;sparks(e.x+6,e.y+8,4,'#fff');beep(300,.06,'triangle',.04,100);
  if(e.coat>=3){e.st='swept';e.dir=dir;e.vx=dir*2;e.ch=0;e.sw=0;beep(260,.2,'sawtooth',.04,300)}
}
function defeat(e,ch){
  e.dead=true;G.score+=100*(1+ch);beep(600,.12,'square',.05,400);sparks(e.x+e.w/2,e.y+8,10,'#ffd23f');
  for(let k=0;k<3;k++)items.push({x:e.x+e.w/2,y:e.y+4,vx:rnd(-1.5,1.5),vy:rnd(-4,-2),k:k&1,st:'fall',tm:0,conv:false,t:rnd(0,6)});
}
function updEnemy(e){
  if(e.st==='walk'){
    if(e.coat>0&&--e.ct<=0){e.coat--;e.ct=150}
    if(e.stun>0){e.stun--;e.vx*=.7}
    else{
      const sp=[.55,.85,.6,1.05][e.ty]*(1-e.coat*.28);
      if(e.ty===1){
        if(e.on){e.vx=0;if(--e.jt<=0){e.vy=-5.6;e.dir=Math.sign(P.x-e.x)||1;e.jt=rnd(45,85)}}
        else e.vx=e.dir*sp;
      }else{
        e.vx=e.dir*sp;
        if(e.on&&!under(e.x+(e.dir>0?e.w+3:-3),e.y+e.h)&&Math.random()<.1){e.dir=-e.dir;e.vx=-e.vx}
        if(e.on&&Math.random()<.004)e.vy=-5.5;
        if(e.ty===2&&--e.ft<=0&&Math.abs(P.y-e.y)<22&&!P.dead){
          e.dir=Math.sign(P.x-e.x)||1;ep.push({x:e.x+e.w/2-4,y:e.y+4,w:8,h:9,vx:e.dir*1.5,k:'bolt'});e.ft=rnd(110,170);
        }
      }
    }
    phys(e);if(e.wall)e.dir=-e.dir;
    if(!P.dead&&hit(P,e)){
      if(isStomp(e,8)){coatHit(e,P.dir);stompBounce()}
      else if(P.inv<=0)hurtPlayer();
    }
  }else if(e.st==='swept'){
    e.vx=e.dir*2;phys(e);e.sw++;
    spawnNews(e.x+e.w/2,e.y+4,e.dir,2);
    if(e.wall){
      if(e.y+e.h>=GY-1){jailCrash(e);return}
      e.dir=-e.dir;e.vx=-e.vx;
    }
    if(boss&&boss.hp>0&&hit(e,boss)){
      for(let k=0;k<4;k++)hurtBoss();
      boss.flash=10;G.shake=Math.max(G.shake,8);beep(90,.3,'sawtooth',.08,-30);
      spawnNews(e.x+e.w/2,e.y+4,-e.dir,12);
      defeat(e,e.ch);return;
    }
    if(e.sw>700){jailCrash(e);return}
    for(const o of en){
      if(o===e||o.dead||o.st!=='walk'||!hit(e,o))continue;
      o.st='swept';o.dir=e.dir;o.vx=e.dir*2;o.ch=e.ch+1;o.sw=0;o.coat=3;beep(380,.08,'triangle',.04,200);
    }
  }
}

/* ---------- río de prensa y cárcel ---------- */
const HL=['ROBO','ESTAFA','SOBRES','FRAUDE','CASO','MULTA','PACTO','TRAMA'];
function spawnNews(x,y,dir,n){
  for(let i=0;i<n&&news.length<220;i++){

      photo:Math.random()<.4,t:HL[(Math.random()*HL.length)|0],rot:rnd(-.5,.5),vr:rnd(-.15,.15),shade:(Math.random()*3)|0,life:420});
  }
}
function jailCrash(e){
  const side=e.dir>0?1:0;
  jail[side].n=Math.min(3,jail[side].n+1);jail[side].f=14;
  G.shake=Math.max(G.shake,8);
  beep(110,.3,'sawtooth',.07,-50);beep(660,.1,'square',.04,-300);
  spawnNews(e.x+e.w/2,e.y+4,-e.dir,14);

function updNews(){
  for(const p of news){
    if(p.vy>1.6)p.vy=1.6;
    phys(p);p.rot+=p.vr;p.life--;
    if(boss&&boss.hp>0&&hit(p,boss)){
      boss.acc=(boss.acc||0)+.25;
      if(boss.acc>=1){boss.acc-=1;hurtBoss()}
      parts.push({x:p.x+4,y:p.y,vx:rnd(-1,1),vy:rnd(-2,-.5),life:16,c:'#f4f0e0',s:2});
      p.life=0;continue;
    }
    if(p.wall){
      if(p.y+p.h>=GY-1){
        const side=p.dir>0?1:0;jail[side].f=Math.max(jail[side].f,5);
        parts.push({x:p.x+4,y:p.y,vx:-p.dir*rnd(.4,1.8),vy:rnd(-3,-1),life:20,c:'#f4f0e0',s:2});
        if(G.t%8===0){G.shake=Math.max(G.shake,3);beep(150,.05,'square',.03,-60)}
      }
      p.life=0;
    }
  }
  news=news.filter(p=>p.life>0);
  jail.forEach(j=>{if(j.f>0)j.f--});
}
function updEP(){
  for(const p of ep){
    p.x+=p.vx;p.vy=(p.vy||0)+(p.g||0);p.y+=p.vy;
    if(p.x<-14||p.x>W+14)p.dead=true;
    if(p.k==='bag'&&p.y+p.h>=GY){p.dead=true;sparks(p.x+4,GY-2,6,'#c8a050')}
    if(!P.dead&&P.inv<=0&&hit(P,p))hurtPlayer();
  }
  ep=ep.filter(p=>!p.dead);
}

function addBldg(sl){
  if(sl>23||bl.some(b=>b.sl===sl))return;
  bl.push({sl,ty:(sl%3===0)?boss.sec:(sl+boss.sec+1)%4});
  sparks(16+sl*9+7,GY-8,6,'#fff');beep(700+sl*12,.08,'triangle',.04);
  G.ret+=.3;G.score+=50;G.pulse=10;
}
function hurtBoss(){
  if(boss.hp<=0)return;
  boss.hp--;boss.flash=6;G.score+=10;beep(300+rnd(0,80),.06,'triangle',.05,100);
  const sl=Math.min(23,Math.floor((boss.max-boss.hp)*24/boss.max)),conv=sl>boss.ls;
  if(conv)boss.ls=sl;
  for(let k=0;k<2;k++)items.push({x:boss.x+14+rnd(-6,6),y:boss.y+8,vx:rnd(-1.6,1.6),vy:rnd(-4.4,-2.4),k:k,st:'fall',tm:0,conv:conv&&k===0,sl,t:rnd(0,6)});
}
function bossAttack(b,kind){
  const dir=Math.sign(P.x-b.x)||1;b.dir=dir;
  const enr=b.hp<b.max*.4;
  if(kind==='throw'){
    const n=enr?3:2;
    for(let i=0;i<n;i++)ep.push({x:b.x+b.w/2,y:b.y+4,w:8,h:9,vx:dir*(1.1+i*.55),vy:-3.6-i*.3,g:.14,k:'bag'});
  }else if(kind==='spawn'){
    if(en.length<3){const m=mkEn(0,b.x+8,b.y,dir);m.vy=-3;en.push(m)}
  }else if(kind==='jump'){b.vy=-6.6;b.vx=dir*1.7;b.air=true}
  else if(kind==='sobres'){
    /* sobres con dinero, cada uno con un matón de gafas de sol corriendo detrás */
    const n=enr?3:2;
    for(let i=0;i<n;i++){
      const ex=Math.max(18,Math.min(W-32,b.x+b.w/2+dir*(16+i*34)));
      ep.push({x:ex,y:(i%2)?GY-36:GY-18,w:12,h:8,vx:dir*1.25,vy:0,g:0,k:'env'});
      if(en.length<7){const m=mkEn(3,ex-dir*14-6,GY-16,dir);en.push(m)}
    }
    beep(300,.18,'square',.05,-120);
  }
  else if(kind==='bolt'){
    ep.push({x:b.x-10,y:GY-8,w:10,h:8,vx:-1.8,k:'wave'},{x:b.x+b.w,y:GY-8,w:10,h:8,vx:1.8,k:'wave'});
    beep(160,.25,'sawtooth',.05,200);
  }
}
function updBoss(b){
  if(b.hp<=0)return;
  const enr=b.hp<b.max*.4,sp=enr?.9:.6;
  if(b.flash>0)b.flash--;
  b.at--;
  if(b.on){
    if(Math.abs(P.x-b.x)>20)b.dir=Math.sign(P.x-b.x)||b.dir;
    b.vx=b.at<24?0:b.dir*sp;
  }
  phys(b,[plats[0]]);
  if(b.air&&b.on){
    b.air=false;b.vx=0;G.shake=14;beep(90,.25,'sawtooth',.08,-40);
    if(b.sec>=1)ep.push({x:b.x-10,y:GY-8,w:10,h:8,vx:-1.5,k:'wave'},{x:b.x+b.w,y:GY-8,w:10,h:8,vx:1.5,k:'wave'});
  }
  if(b.at<=0&&b.on){const a=ATK[b.sec];bossAttack(b,a[(Math.random()*a.length)|0]);b.at=rnd(90,130)-(enr?30:0)}
  b.et=(b.et===undefined?260:b.et)-1;
  if(b.et<=0&&b.on){bossAttack(b,'sobres');b.et=rnd(380,520)-(enr?120:0);b.at=Math.max(b.at,50)}
  if(!P.dead&&hit(P,b)){
    if(isStomp(b,12)){if(b.flash===0)hurtBoss();stompBounce()}
    else if(P.inv<=0)hurtPlayer();
  }
}

/* ---------- objetos, palabras ---------- */
function updWords(){
  for(const w of words){
    w.x+=w.vx;w.y+=w.vy;w.vy+=.012;w.life--;
    if(w.x<4||w.x+w.w>W-4)w.life=0;
    if(boss&&boss.hp>0&&hit(w,boss)){hurtBoss();w.life=0;continue}
    for(const e of en){if(e.st==='walk'&&hit(w,e)){coatHit(e,w.vx>0?1:-1);w.life=0;break}}
  }
  words=words.filter(w=>w.life>0);
}
function updItems(){
  for(const it of items){
    if(it.st==='fall'){
      it.x+=it.vx;it.vy+=.2;it.y+=it.vy;
      if(it.x<14||it.x>W-14)it.vx=-it.vx;
      if(it.y>=GY-3&&it.vy>0){it.y=GY-3;it.vy=-it.vy*.45;it.vx*=.7;if(Math.abs(it.vy)<.9){it.st='wait';it.tm=it.conv?16:34}}
    }else if(it.st==='wait'){
      if(--it.tm<=0){if(it.conv){addBldg(it.sl);it.dead=true}else it.st='fly'}
    }else{
      it.x+=(236-it.x)*.12;it.y+=(7-it.y)*.12;
      if(Math.abs(it.x-236)<8&&it.y<14){it.dead=true;G.ret+=.2;G.pulse=8}
    }
  }
  items=items.filter(i=>!i.dead);
}

/* ---------- bucle ---------- */
function update(){
  G.t++;if(G.pulse>0)G.pulse--;if(G.shake>0)G.shake--;
  const s=G.state;
  if(s==='title'||s==='over'){if(s==='over')G.vt++;updParts();prev.j=K.j;return}
  if(s==='end'||s==='victory'){G.vt++;confetti();updParts();prev.j=K.j;return}
  if(s==='intro'){if(++G.vt>80)G.state='play';updParts();prev.j=K.j;return}
  updPlayer();updWords();
  if(G.state==='play'){
    en.forEach(updEnemy);en=en.filter(e=>!e.dead);
    if(boss)updBoss(boss);
    updEP();
    if(!boss&&en.length===0&&!P.dead){G.state='clear';G.vt=0;beep(500,.3,'triangle',.05,400)}
    if(boss&&boss.hp<=0){
      G.state='bossdown';G.vt=0;P.inv=99999;G.shake=30;
      en.forEach(e=>defeat(e,0));en=[];ep=[];beep(120,.6,'sawtooth',.07,300);
    }
  }else if(G.state==='clear'){
    if(++G.vt>100)nextStage();
  }else if(G.state==='bossdown'){
    G.vt++;boss.flash=G.vt&1;
    if(G.vt%3===0){const m=[...Array(24).keys()].find(i=>!bl.some(b=>b.sl===i));if(m!==undefined)addBldg(m)}
    if(G.vt%4===0)items.push({x:boss.x+14,y:boss.y+8,vx:rnd(-2,2),vy:rnd(-5,-3),k:(Math.random()*2)|0,st:'fall',tm:0,conv:false,t:rnd(0,6)});
    if(G.vt>110){G.state='victory';G.vt=0;parts=[];items=[];beep(523,.15,'triangle',.05);setTimeout(()=>beep(659,.15,'triangle',.05),150);setTimeout(()=>beep(784,.3,'triangle',.05),300)}
  }
  updItems();updNews();updParts();prev.j=K.j;
}
function render(){
  ctx.setTransform(S,0,0,S,0,0);ctx.globalAlpha=1;
  const s=G.state;
  ctx.save();
  if(G.shake>0)ctx.translate(Math.round(rnd(-2,2)),Math.round(rnd(-2,2)));
  if(s==='title')drawTitle();
  else if(s==='victory')drawDemo(STAGES[G.stage].sec,G.vt,false);
  else if(s==='end')drawDemo(3,G.vt,true);
  else{
    ctx.drawImage(st,0,0,W,H);
    bl.forEach(b=>drawBldg(b.ty,16+b.sl*9,GY,1));
    drawJail();
    items.forEach(drawItem);
    en.forEach(drawEnemy);
    if(boss)drawBoss(boss);
    drawNews();
    drawPlayer(P);
    words.forEach(drawWord);
    ep.forEach(drawProj);
  }
  for(const p of parts){if(p.life<8)ctx.globalAlpha=p.life/8;R(p.x,p.y,p.s,p.s,p.c);ctx.globalAlpha=1}
  if(s!=='title'&&s!=='victory'&&s!=='end'){
    drawHUD();
    const sec=STAGES[G.stage].sec;
    if(s==='intro'){if(boss)banner(SEC[sec].bo,'¡JEFE DE NIVEL!','#ff6a5a');else banner(SEC[sec].n,'¡DEVUELVE EL DINERO!')}
    if(s==='clear')banner('¡PANTALLA LIMPIA!','',' #7ae8ff'.trim());
    if(s==='over')banner('SIN VIDAS','PULSA PARA REINTENTAR','#ff6a5a');
  }
  ctx.restore();
}
let last=0,acc=0;
function frame(ts){
  pollPad();
  acc+=Math.min(100,ts-last);last=ts;
  while(acc>=16.667){update();acc-=16.667}
  render();requestAnimationFrame(frame);
}
renderStatic(0,mkPlats(LAY[0]));
const go=()=>requestAnimationFrame(frame);
try{Promise.race([document.fonts.load('8px "Press Start 2P"'),new Promise(r=>setTimeout(r,1500))]).then(go,go)}catch(e){go()}
})();
</script>
