<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Nadie se queda atrás</title>
<style>
:root{--bg:#10142a;--fg:#f4ecd8;--panel:#1f2547;--line:#f2b84b;--ac:#d4533b;--ac2:#3b86d4}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:"Courier New",Courier,monospace;font-weight:700;-webkit-tap-highlight-color:transparent}
canvas,.pix{image-rendering:pixelated;image-rendering:crisp-edges}
.px{background:var(--panel);border:3px solid var(--line);box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--line);padding:10px;margin:8px 6px}
.btn{font:inherit;background:var(--ac);color:var(--onac,#fff);border:3px solid #000;padding:8px 12px;cursor:pointer;box-shadow:3px 3px 0 #000;text-transform:uppercase;letter-spacing:.5px;margin:3px}
.btn:active{transform:translate(3px,3px);box-shadow:none}
.btn.alt{background:var(--ac2)}.btn.dim{background:#555;color:#ddd}.btn.sel{outline:3px solid #fff;outline-offset:1px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
h1,h2,h3{margin:.3em 0;text-transform:uppercase;letter-spacing:1px}
h1{font-size:clamp(22px,5vw,34px)}h2{font-size:clamp(16px,3.5vw,22px)}
p{margin:.5em 0;line-height:1.35}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.bar{height:12px;background:#0007;border:2px solid #000;position:relative}.bar>i{display:block;height:100%;background:var(--ac);transition:width .3s}
.hide{display:none!important}
.tag{display:inline-block;border:2px solid #000;padding:0 5px;font-size:12px;background:var(--ac2);color:#fff;margin:1px}
.wrap{max-width:920px;margin:0 auto;padding:10px}
.small{font-size:12px;opacity:.85}
.center{text-align:center}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
.ov>.px{max-width:560px;width:100%;max-height:92vh;overflow:auto}
canvas.fit{width:100%;height:auto;display:block}
.good{color:#6fe08a}.bad{color:#ff7a7a}.warn{color:#ffd86b}
a{color:var(--ac2)}
@media(max-width:600px){.btn{padding:10px 9px;font-size:13px}.px{padding:8px}}
/* ---- ARC: pausa, meme y compartir (estilo Voto Power) ---- */
.arc-ov{position:fixed;inset:0;display:flex;align-items:flex-start;justify-content:center;background:rgba(18,15,31,.97);z-index:90;padding:16px;text-align:center;overflow-y:auto;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-weight:700;color:#fff;touch-action:pan-y}
.arc-card{max-width:480px;width:100%;margin:auto}
.arc-card h1{font-family:Impact,"Arial Black",sans-serif;font-size:clamp(34px,8vw,56px);margin:0;letter-spacing:2px;color:#ffd23f;text-shadow:3px 3px 0 #e63946;text-transform:uppercase}
.arc-card p{margin:8px 0;line-height:1.35}
.arc-b{display:inline-block;border:0;border-radius:12px;background:#e63946;color:#fff;font-weight:800;font-size:17px;padding:12px 20px;margin:5px;cursor:pointer;text-decoration:none;font-family:inherit;text-transform:none;letter-spacing:0;box-shadow:none}
.arc-b:active{transform:translateY(2px)}
.arc-b.alt{background:#3a86ff}.arc-b.ok{background:#2a9d8f}.arc-b.dark{background:#444}
.arc-help{background:rgba(255,255,255,.08);border-radius:12px;padding:10px 14px;font-size:13px;margin-top:10px;font-weight:600}
#arcMemeCv{width:100%;max-width:440px;border-radius:10px;box-shadow:0 6px 30px #000a;image-rendering:pixelated;image-rendering:crisp-edges}
.arc-sl{display:block;background:rgba(255,255,255,.1);border-radius:10px;padding:10px;margin:6px 0;text-align:left;cursor:pointer;font-weight:700}
.arc-card input[type=text]{width:100%;box-sizing:border-box;padding:11px;border-radius:10px;border:0;font-size:16px;margin:6px 0;font-family:inherit}
#arcPauseBtn{position:fixed;z-index:60;width:44px;height:36px;border-radius:9px;border:2px solid rgba(255,255,255,.6);background:rgba(18,15,31,.6);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;padding:0;touch-action:manipulation}
#arcPauseBtn i{display:block;width:6px;height:16px;background:#fff}
#arcPauseBtn:active{background:rgba(255,210,63,.6)}
/* ---- skin Voto Power para juegos de mesa (body.vp) ---- */
.vp{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.vp h1{font-family:Impact,"Arial Black",sans-serif;color:#ffd23f;text-shadow:3px 3px 0 #e63946;letter-spacing:2px;font-size:clamp(26px,6vw,40px)}
.vp h2{font-family:Impact,"Arial Black",sans-serif;letter-spacing:1px}
.vp .px{border:2px solid rgba(255,255,255,.14);box-shadow:none;border-radius:14px;background:rgba(255,255,255,.07)}
.vp .btn{border:0;border-radius:12px;box-shadow:0 3px 0 rgba(0,0,0,.35);font-weight:800;text-transform:none;letter-spacing:0;font-size:15px;padding:10px 16px}
.vp .btn:active{transform:translateY(3px);box-shadow:none}
.vp canvas.fit{border-radius:14px}
.vp .tag{border:0;border-radius:8px;padding:2px 8px}
.vp .bar,.vp .seg i{border-radius:3px}
.vp .card{border-radius:12px}

html,body{overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#c{width:min(100vw,calc((100vh - 190px)*5/3));height:auto;aspect-ratio:5/3;background:#000;border:3px solid var(--line)}
#pad{display:flex;gap:10px;width:min(100vw,calc((100vh - 190px)*5/3));padding:4px 0 0;align-items:stretch}
#pad .btn{font-size:20px;padding:0;border-radius:10px;height:96px;touch-action:none}
#pad .grp{display:flex;gap:8px;flex:1}#pad .grp.r{flex:1.5}#pad .grp.r .col{display:flex;flex-direction:column;gap:8px;flex:1}
#pad .mv{flex:1;font-size:34px}#pad .jp{flex:1.3;font-size:22px}#pad .col .btn{height:44px;font-size:15px}
#aux{display:flex;gap:6px;justify-content:flex-end;width:min(100vw,calc((100vh - 190px)*5/3));padding:4px 0 0}
#aux .btn{height:28px;font-size:12px;padding:0 10px;border-radius:6px;opacity:.85}


.btn.d{transform:translate(3px,3px);box-shadow:none;filter:brightness(1.3)}
.glow{animation:gl .9s infinite}@keyframes gl{50%{filter:brightness(1.7);box-shadow:0 0 14px #7cf08a}}
@media (max-height:520px) and (orientation:landscape){
#c{width:min(calc(100vw - 372px),calc((100vh - 8px)*5/3))}
#pad{position:static;width:0;padding:0}
#pad .grp{position:fixed;bottom:10px;gap:8px}#pad .grp:first-child{left:10px}#pad .grp.r{right:10px}
#pad .btn{height:84px;width:84px}#pad .jp{width:96px}#pad .col .btn{height:38px;width:92px;font-size:13px}
#aux{position:fixed;left:50%;bottom:4px;transform:translateX(-50%);width:auto;padding:0}}
.lv{display:block;width:100%;text-align:left;margin:6px 0}
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="640" height="384"></canvas>
<div id="aux"><button class="btn" id="hintBtn" data-k="H" style="background:#2a7a4a">💡 PISTA</button><button class="btn" data-k="X" style="background:#7a3a2a">↺ REINICIAR</button></div>
<div id="pad"><div class="grp"><button class="btn mv" data-k="L">◀</button><button class="btn mv" data-k="R">▶</button></div><div class="grp r"><button class="btn jp" data-k="J">SALTAR</button><div class="col"><button class="btn" data-k="Q">LEVANTAR</button><button class="btn" data-k="S">CAMBIAR</button></div></div></div></div>
<div class="ov" id="ovl"><div class="px center" id="ovc"></div></div>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
function h(tag,at,...kids){const e=document.createElement(tag);if(at)for(const k in at){const v=at[k];if(k==='class')e.className=v;else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);else if(k==='html')e.innerHTML=v;else if(v!==false&&v!=null)e.setAttribute(k,v);}for(const c of kids.flat(9))if(c!=null&&c!==false)e.append(c.nodeType?c:document.createTextNode(c));return e;}
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
let AC=null,MUTE=false;
function beep(f,d=.08,t='square',v=.04,f2){if(MUTE)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;if(f2)o.frequency.exponentialRampToValueAtTime(f2,AC.currentTime+d);g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d);}catch(e){}}
function noise(d=.08,v=.05,hp=800){if(MUTE)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=hp;const g=AC.createGain();g.gain.value=v;s.connect(f);f.connect(g);g.connect(AC.destination);s.start();}catch(e){}}
function spr(rows,pal,sc){const w=Math.max(...rows.map(r=>r.length)),hh=rows.length,c=document.createElement('canvas');c.width=w;c.height=hh;const x=c.getContext('2d');rows.forEach((r,j)=>[...r].forEach((ch,i)=>{if(pal[ch]){x.fillStyle=pal[ch];x.fillRect(i,j,1,1);}}));c.style.width=w*sc+'px';c.style.height=hh*sc+'px';c.className='pix';return c;}
function drawSpr(ctx,rows,pal,x,y,sc=1,flip){rows.forEach((r,j)=>[...r].forEach((ch,i)=>{if(pal[ch]){ctx.fillStyle=pal[ch];const ii=flip?r.length-1-i:i;ctx.fillRect(x+ii*sc,y+j*sc,sc,sc);}}));}
function store(k,v){try{if(v===undefined){const s=localStorage.getItem(k);return s?JSON.parse(s):null;}localStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}}
const _tc=document.createElement('canvas'),_tx=_tc.getContext('2d',{willReadFrequently:true}),_pc={};
function ptext(c,txt,x,y,px,col,al){const key=txt+'|'+px+'|'+col;let m=_pc[key];if(!m){_tx.font='bold '+px+'px "Courier New",Courier,monospace';const w=Math.ceil(_tx.measureText(txt).width)+2,hh=px+4;_tc.width=w;_tc.height=hh;_tx.font='bold '+px+'px "Courier New",Courier,monospace';_tx.textBaseline='top';_tx.fillStyle='#000';_tx.fillText(txt,1,1);const d=_tx.getImageData(0,0,w,hh).data,o=document.createElement('canvas');o.width=w;o.height=hh;const ox=o.getContext('2d'),im=ox.createImageData(w,hh);const cc=document.createElement('canvas').getContext('2d');cc.fillStyle=col;cc.fillRect(0,0,1,1);const rgb=cc.getImageData(0,0,1,1).data;for(let i=0;i<w*hh;i++){if(d[i*4+3]>110){im.data[i*4]=rgb[0];im.data[i*4+1]=rgb[1];im.data[i*4+2]=rgb[2];im.data[i*4+3]=255;}}ox.putImageData(im,0,0);m=_pc[key]=o;}c.drawImage(m,Math.round(x-(al==='c'?m.width/2:al==='r'?m.width:0)),Math.round(y));return m.width;}
function toast(msg,ms=1800){const t=h('div',{class:'px',style:'position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:99;max-width:90vw;background:#111;color:#fff'},msg);document.body.append(t);setTimeout(()=>t.remove(),ms);}
function modal(content,onclose){const o=h('div',{class:'ov'},h('div',{class:'px'},content));document.body.append(o);o.close=()=>{o.remove();onclose&&onclose();};return o;}

/* ===== ARC: pausa + pantalla meme + compartir (de Voto Power) ===== */
const ARC=(()=>{
const A={paused:false,cfg:{}};
const SLO=['¡GANAREMOS AL FASCISMO!','MI VOTO NO ES PARA LOS MULTIMILLONARIOS, ES PARA LAS NECESIDADES'];
let pb,po,mo,mcv,lo,opts=null,sndB,msgEl,hand,urlI;
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k)||'';localStorage.setItem(k,v);}catch(e){}return '';};
const mixc=(a,b,k)=>{const f=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16));const A1=f(a),B=f(b);return '#'+A1.map((v,i)=>Math.round(v+(B[i]-v)*k).toString(16).padStart(2,'0')).join('');};
const hs=(a)=>{const v=Math.sin(a*127.1+311.7)*43758.5453;return v-Math.floor(v);};
const getSlo=()=>+(document.querySelector('input[name=arcslo]:checked')||{value:0}).value;
const getFmt=()=>(document.querySelector('input[name=arcfmt]:checked')||{value:'img'}).value;
const getHandle=()=>hand?hand.value.trim():'';
const isHttp=()=>/^https?:/.test(location.protocol);
const gameUrl=()=>((urlI&&urlI.value.trim())||ls('vp_url')||(isHttp()?location.href.split('#')[0]:'')).trim();
const shareText=()=>{const u=gameUrl(),c=A.cfg;return SLO[getSlo()].replace(/^¡|!$/g,'')+' '+(c.tag||'')+' '+getHandle()+(u?'\n🎮 Juega aquí: '+u:'');};
const setMsg=t=>{if(msgEl)msgEl.innerHTML=t;};

/* ---------- pausa ---------- */
function canPause(){return !(mo&&!mo.classList.contains('hide'))&&(A.cfg.canPause?A.cfg.canPause():true);}
A.pause=function(v){
  if(v&&(A.paused||!canPause()))return;
  if(!v&&!A.paused)return;
  A.paused=v;po.classList.toggle('hide',!v);
  if(A.cfg.onPause)A.cfg.onPause(v);
  if(!v)A.place();
};
A.place=function(){
  if(!pb)return;
  const c=A.cfg.canvas;
  if(c){const r=c.getBoundingClientRect();pb.style.left=Math.max(4,r.right-54)+'px';pb.style.top=Math.max(4,r.top+(A.cfg.pauseY||6))+'px';pb.style.right='auto';}
  else{pb.style.right='12px';pb.style.bottom='12px';pb.style.top='auto';pb.style.left='auto';}
  pb.style.display=(canPause()&&!A.paused)?'flex':'none';
};
async function sendGame(){
  let u=gameUrl();
  if(!u){u=(prompt('Pega el enlace donde hayas alojado el juego (Netlify, GitHub Pages…):')||'').trim();if(!u)return;ls('vp_url',u);}
  const text='🎮 '+(A.cfg.title||'Juego')+': '+(A.cfg.blurb||'¡Entre todos venceremos al fascismo!');
  if(navigator.share){try{await navigator.share({title:A.cfg.title,text,url:u});}catch(e){}return;}
  window.open('https://wa.me/?text='+encodeURIComponent(text+'\n'+u),'_blank');
}
A.sendGame=sendGame;

/* ---------- figuras cabezón (estilo Voto Power) ---------- */
A.fig=function(g,x,y,u,o){o=o||{};const sk=o.skin||'#f2c6a0',sh=o.shirt||'#3a86ff',pa=o.pants||'#2b3252',hr=o.hair||'#3a2a20',yy=y-(o.bob||0);
  const R=(c,a,b,w,hh)=>{g.fillStyle=c;g.fillRect(Math.round(x+a*u),Math.round(yy+b*u),Math.max(1,Math.round(w*u)),Math.max(1,Math.round(hh*u)));};
  R('rgba(0,0,0,.25)',-3,0,6,.8);
  R(pa,-2,-4,1.6,4);R(pa,.4,-4,1.6,4);R('#111',-2.2,-.8,2,.8);R('#111',.2,-.8,2,.8);
  R(sh,-2.6,-9,5.2,5.2);R('rgba(0,0,0,.18)',-2.6,-5,5.2,1.2);
  if(o.up){R(sh,-4,-14,1.4,6);R(sh,2.6,-14,1.4,6);R(sk,-4,-15.4,1.4,1.4);R(sk,2.6,-15.4,1.4,1.4);}
  else{R(sh,-3.8,-9,1.2,4.5);R(sh,2.6,-9,1.2,4.5);R(sk,-3.8,-4.6,1.2,1);R(sk,2.6,-4.6,1.2,1);}
  R(sk,-3.6,-16,7.2,7);R(hr,-3.6,-16.6,7.2,2.6);if(o.long){R(hr,-3.8,-14,1.2,5);R(hr,2.6,-14,1.2,5);}
  R('#fff',-2.1,-13.2,1.6,1.6);R('#fff',.5,-13.2,1.6,1.6);R('#111',-1.5,-12.9,.9,1.1);R('#111',1.1,-12.9,.9,1.1);
  R('#b5544a',-.9,-10.9,1.8,.6);
  if(o.hat)R(o.hat,-3.9,-17.6,7.8,1.6);
  if(o.sign){R('#7a5a3a',3.9,-24,.8,10);R('#fff',2.2,-26.5,6.4,4.4);R(o.sign,2.8,-25.9,5.2,3.2);}
};

/* ---------- meme ---------- */
function wrapLines(txt,px,maxW){const cw=px*.6,mx=Math.floor(maxW/cw),ws=txt.split(' '),ls2=[];let l='';for(const w of ws){const t=l?l+' '+w:w;if(t.length>mx&&l){ls2.push(l);l=w;}else l=t;}ls2.push(l);return ls2;}
function outlined(g,t,x,y,px,col,out,al){[[-1,0],[1,0],[0,-1],[0,1],[1,1]].forEach(d=>ptext(g,t,x+d[0],y+d[1],px,out,al));ptext(g,t,x,y,px,col,al);}
function paint(tt){
  const g=lo.getContext('2d'),o=opts||{};g.imageSmoothingEnabled=false;
  for(let y=0;y<270;y+=6){g.fillStyle=mixc(o.c1||'#2b1b5a',o.c2||'#e63946',y/270);g.fillRect(0,y,270,6);}
  g.fillStyle='rgba(255,255,255,.07)';for(let y=0;y<270;y+=9)for(let x=(y/9%2)*4.5;x<270;x+=9)g.fillRect(x|0,y,2,2);
  g.save();g.translate(70,95);g.rotate(tt*.4);g.fillStyle='rgba(255,230,120,.12)';for(let i=0;i<12;i++){g.rotate(Math.PI*2/12);g.beginPath();g.moveTo(0,0);g.lineTo(150,-9);g.lineTo(150,9);g.fill();}g.restore();
  const T0=(o.title||'JUEGO').toUpperCase(),tpx=Math.min(24,Math.floor(250/(T0.length*.6)));
  outlined(g,T0,135,6+(24-tpx)/3,tpx,'#ffd23f','#1b1b2f','c');ptext(g,T0,136,7+(24-tpx)/3,tpx,'#e63946','c');ptext(g,T0,135,6+(24-tpx)/3,tpx,'#ffd23f','c');
  // arte
  g.save();g.beginPath();g.rect(4,36,116,114);g.clip();if(o.art)o.art(g,tt,A);g.restore();
  // panel
  g.fillStyle='rgba(0,0,0,.5)';g.fillRect(122,38,144,108);g.fillStyle='#ffd23f';g.fillRect(122,38,144,1);
  ptext(g,'RESULTADOS',130,42,10,'#fff');
  (o.stats||[]).slice(0,4).forEach((s,i)=>{const y=58+i*18;ptext(g,s[0],130,y+2,8,'#ffd23f');ptext(g,String(s[1]),259,y-1,11,'#fff','r');});
  const rk=(o.rank||'').toUpperCase(),rpx=Math.max(6,Math.min(10,Math.floor(132/(rk.length*.6||1))));
  g.fillStyle=o.win===false?'#a8323c':'#2a9d8f';g.fillRect(126,128,136,15);ptext(g,rk,194,129+(10-rpx)/2,rpx,'#fff','c');
  // lema
  g.fillStyle='#000';g.fillRect(0,152,270,90);
  const sl=SLO[getSlo()],spx=getSlo()?12:17,lh=spx+3,L=wrapLines(sl,spx,256),y0=197-L.length*lh/2;
  L.forEach((l,i)=>outlined(g,l,135,y0+i*lh,spx,'#fff','#e63946','c'));
  const tg=(A.cfg.tag||'')+(getHandle()?'  ·  '+getHandle():'');
  ptext(g,tg,135,245,9,'#ffd23f','c');
  const gu=gameUrl().replace(/^https?:\/\//,'');if(gu)ptext(g,'> '+gu.slice(0,40),135,258,7,'#fff','c');
  if(tt){for(let i=0;i<46;i++){const x=hs(i)*270,y=(tt*42*(.6+hs(i+3))+hs(i+7)*270)%280-5;g.fillStyle=['#ffd23f','#e63946','#3a86ff','#2a9d8f','#fff'][i%5];g.fillRect(x|0,y|0,3,2);}}
  return lo;
}
function drawMeme(){const m=mcv.getContext('2d');m.imageSmoothingEnabled=false;m.drawImage(paint(0),0,0,mcv.width,mcv.height);}
const blobOf=()=>new Promise(r=>mcv.toBlob(r,'image/png'));
function download(b,name){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();}
function pickVideoType(){if(!window.MediaRecorder)return '';return ['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(t=>MediaRecorder.isTypeSupported(t))||'';}
